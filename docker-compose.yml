services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faultloc
      POSTGRES_PASSWORD: faultloc
      POSTGRES_DB: faultloc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultloc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://faultloc:faultloc@db:5432/faultloc
      DATABASE_URL_SYNC: postgresql://faultloc:faultloc@db:5432/faultloc
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
